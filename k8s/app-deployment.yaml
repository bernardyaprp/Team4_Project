apiVersion: apps/v1
kind: Deployment
metadata:
  name: typerush
spec:
  replicas: 1
  selector:
    matchLabels:
      app: typerush
  template:
    metadata:
      labels:
        app: typerush
    spec:
      containers:
        - name: typerush
          image: typerush:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: SESSION_SECRET
              value: change-this-to-a-random-string
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: typerush
spec:
  type: NodePort
  selector:
    app: typerush
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 3000
